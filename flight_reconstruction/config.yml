# Configuration for Metashape automated reconstruction

# Sensor profile: auto (from EXIF), m3m, or p1. Profiles below override the baseline.
sensor: auto

# GPS/RTK configuration
gps:
  enabled: true
  use_rtk: true

# Image quality analysis
image_quality:
  # Filter out images below this quality threshold (0.0-1.0)
  quality_threshold: 0.70

# Photo matching parameters
photo_matching:
  downscale: 1
  keypoint_limit: 80000
  keypoint_limit_per_mpx: 2000
  tiepoint_limit: 0
  generic_preselection: false
  reference_preselection: true
  filter_mask: false
  mask_tiepoints: true
  filter_stationary_points: true
  keep_keypoints: true
  guided_matching: true
  subdivide_task: false

# Camera alignment and optimization
camera:
  # Initial alignment parameters
  align:
    adaptive_fitting: false
    min_image: 2
    retry_unaligned: false

  # Camera optimization parameters
  optimize:
    fit_f: true
    fit_cx: true
    fit_cy: true
    fit_k1: true
    fit_k2: true
    fit_k3: true
    fit_k4: true
    fit_p1: true
    fit_p2: true
    fit_b1: true
    fit_b2: true
    fit_corrections: true
    tiepoint_covariance: true
    adaptive_fitting: false

# Tie point filtering
tie_point_filtering:
  # USGS-recommended filtering thresholds
  reconstruction_uncertainty:
    percentile: 20
    min_threshold: 15.0

  projection_accuracy:
    percentile: 30
    min_threshold: 2.0

  reprojection_error:
    percentile: 5
    min_threshold: 0.3

# Outer boundary (buffered hull of camera positions) used to clip raster exports
boundary:
  enabled: false
  buffer_m: 12.0

# Depth maps parameters
depth_maps:
  downscale: 2
  filter_mode: "disabled"  # Options: "mild", "moderate", "aggressive", "disabled"
  reuse_depth: false
  max_neighbors: 64
  max_gpu_multiplier: 24
  subdivide_task: false

# Point cloud parameters
point_cloud:
  source_data: "depth_maps"
  point_colors: true
  point_confidence: true
  keep_depth: true
  max_neighbors: 64
  subdivide_task: false

  # Remove points with confidence below min_confidence
  confidence_filter:
    enabled: false
    min_confidence: 2

  # Export parameters
  export:
    save_point_color: true
    save_point_normal: true
    save_point_confidence: true
    format: "las" # Options: "las", "laz", "e57", "ply", "xyz"

# Ground point classification parameters
classify_ground_points:
  max_angle: 15.0
  max_distance: 1.0
  cell_size: 50.0

# Mesh parameters
model:
  surface_type: "arbitrary"   # Options: "arbitrary", "height_field"
  interpolation: "enabled"    # Options: "enabled", "extrapolated", "disabled"
  subdivide_task: false
  vertex_colors: false
  vertex_confidence: true
  keep_depth: true

# Elevation surface parameters (DTM, DSM, CHM)
dem:
  source: "model"   # DSM source: "model", "point_cloud", "depth_maps"
  resolution: 0  # 0 = auto; DTM and CHM use the DSM grid
  tiff_big: true
  tiff_tiled: false
  tiff_overviews: true
  subdivide_task: false
  nodata: -32767

# Orthomosaic parameters
orthomosaic:
  surface: "model"  # Options: "model", "dem"
  blending_mode: "mosaic"
  ghosting_filter: true
  fill_holes: true
  cull_faces: true
  refine_seamlines: false
  subdivide_task: false

  # Export parameters
  export:
    tiff_big: true
    tiff_tiled: true
    tiff_overviews: true
    white_background: false
    nodata: -32767

sensor_profiles:
  m3m: {}
  p1:
    camera:
      align:
        retry_unaligned: true
      optimize:
        fit_k4: false
        fit_corrections: false
    boundary:
      enabled: true
    depth_maps:
      filter_mode: "mild"
      max_neighbors: 32
    point_cloud:
      confidence_filter:
        enabled: true
        min_confidence: 2
    model:
      interpolation: "extrapolated"
