# Strict PEP 8: pycodestyle E/W, pyflakes F, pep8-naming N, PEP 257 docstrings D.
line-length = 79
target-version = "py313"
extend-exclude = ["sample_data", "runs", "*.ipynb"]

[lint]
select = ["E", "W", "F", "N", "D"]
pydocstyle = { convention = "pep257" }

[lint.per-file-ignores]
"__init__.py" = ["D104"]
