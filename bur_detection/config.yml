# YOLO Bur Detection Configuration

training_steps:  # physical batch capped at 64 (avoids the GPU OOM/wedge); accumulate keeps effective batch
  - batch: 16
    accumulate: 1
    max_epochs: 150
    patience: 10
  - batch: 64
    accumulate: 1
    max_epochs: 150
    patience: 15
  - batch: 64
    accumulate: 4
    max_epochs: 150
    patience: 20
  - batch: 64
    accumulate: 16
    max_epochs: 150
    patience: 25
  
training_params: # best-known hparams for `--mode train`; seeds tuning trial 0 only if ray_tune.warm_start: true (off below)
  - model_size: bur_detection/model_cfgs/yolo11m-p2.yaml
    optimizer: SGD
    lr0: 0.00372977
    lrf: 0.0326850
    momentum: 0.943194
    weight_decay: 0.00834569
    box_gain: 4.43
    cls_gain: 0.56
    dfl_gain: 0.800343
    hsv_h: 0.00700662
    hsv_s: 0.490966
    hsv_v: 0.156020
    degrees: 49.9110
    scale: 0.385502
    flipud: 0.0811662

# Composite objective for tuning + best-model selection.
# Optimizes a gain-invariant blend instead of raw val_loss (which is confounded
# by also tuning the box/cls/dfl loss gains).
score_weights:
  loss: 0.45
  f1: 0.35
  map50: 0.20

# Fixed architecture knobs for the small/dense-object experiment (not tuned).
warmstart: true   # for P2 (.yaml) model archs: load the matching pretrained .pt into the backbone before fine-tuning
tal_topk: 13      # TAL assigner top-k (ultralytics default 10) -- more candidate positives per GT for dense small burs

# Progressive-step LR scaling:
#   scaled_lr = min( min(lr0, max_lr0) * (eff_batch / ref)^power , max_scaled_lr )
# Defaults below suit the current SGD config (lr0 ~ 0.0075, search max 0.01).
# For AdamW use lower caps (e.g. max_lr0=0.003, max_scaled_lr=0.005).
lr_reference_effective_batch: 64
lr_scale_power: 0.5
max_lr0: 0.01
max_scaled_lr: 0.03
step_transition_warmup_epochs: 10   # LR warmup epochs at each unfreeze transition (gentler ramp = smaller spike)

# Tuning-results analysis plots written at the end of a tuning run.
analysis:
  enabled: true
  top_n: 10

# Revised from the run_20260625 150-trial analysis. SGD swept the top 20; the "s" archs were
# dominated; box/cls gain move only the gain-scaled val_loss (no f1/mAP50 effect) so they're pinned;
# momentum railed at its floor and hsv_h/hsv_s at their ceilings; the rest converged tight.
tuning_space:
  model_size: ["yolov8m-p2.yaml", "yolov8l-p2.yaml",
               "bur_detection/model_cfgs/yolo11m-p2.yaml", "bur_detection/model_cfgs/yolo11l-p2.yaml"]
  optimizer: ["SGD"]
  lr0: {"loguniform": [0.002, 0.006]}    # converged ~0.003
  lrf: {"loguniform": [0.01, 0.05]}      # converged ~0.026
  momentum: {"uniform": [0.80, 0.95]}    # railed at the old 0.85 floor -> open downward
  weight_decay: {"loguniform": [0.003, 0.02]}   # wanted high -> lift the ceiling
  box_gain: [4.43]      # pinned: detection-neutral, only scales val_loss
  cls_gain: [0.56]      # pinned: same
  dfl_gain: {"uniform": [0.8, 3.0]}      # real localization effect, railed at the old 1.5 floor
  hsv_h: {"uniform": [0.002, 0.01]}      # railed at the old 0.005 ceiling
  hsv_s: {"uniform": [0.2, 0.5]}         # railed at the old 0.3 ceiling
  hsv_v: {"uniform": [0.1, 0.18]}        # converged low
  degrees: {"uniform": [30.0, 75.0]}     # converged ~50 despite the old [0,180] range
  scale: {"uniform": [0.3, 0.45]}        # converged ~0.355
  flipud: {"uniform": [0.05, 0.35]}      # converged ~0.17

ray_tune:
  num_samples: 150
  max_concurrent_trials: 1   # one trial at a time -- P2 + batch 64 needs ~12 GB; concurrency 2 OOMs yolo11m-p2 on 24 GB
  keep_top_n: 5              # only this many trials' checkpoints (best-objective epoch each) stay on disk; the rest are reaped as trials finish
  # Seed trial 0 with training_params (warm start). Turn on once you have a config that
  # fits the current search space; leave off to explore from scratch.
  warm_start: false

inference:
  model_path: null # specify path to model .pt, or use most-recent from training/tuning
  conf_threshold: 0.5
  iou_threshold: 0.45       # per-tile NMS during predict()
  global_nms_iou: 0.3       # light cross-tile NMS after core-region filtering
  tile_batch_size: 96       # tiles per batched predict() call

data:
  # Bundled sample (download bur_detection/sample_data from Google Drive): the cleaned
  # Orchard 4 tile set in training/tiled/ (ready to split + train), plus the source canopy
  # images + polygon labels in training/full_canopy/ for reference/re-tiling. Point at your
  # own dataset with `--data-root <dir>` to tile full_canopy/ via the tiler.
  training_dir: bur_detection/sample_data/training/tiled
  outputs_dir: bur_detection/sample_data/training/outputs
  image_selections: image_selection/sample_data/outputs/best_image_selections.json
  # Tiling source for --mode preprocess; null = split the pre-made tiles in training_dir.
  # --data-root sets these to <root>/full_canopy/{images,labels,canopy}.
  full_res_images_dir: null
  polygon_labels_dir: null
  canopy_labels_dir: null
  tiling:
    tile_size: 224          # match inference CanopyTiler
    overlap: 0.2
    min_canopy_frac: 0.15   # drop mostly-masked-out (background) tiles
    bg_keep_ratio: 0.3      # fraction of bur-free canopy tiles kept as negatives
    dedup_iou: 0.8          # drop bur boxes overlapping this much (double-annotations)

# Train/val/test split. The group key function is supplied in code
# (bur_tile_group_key); these control the fractions and seed.
split:
  fracs: [0.7, 0.2, 0.1]
  seed: 666